# ClaimAI on a server of your own.
#
# By default this starts the app and its database only, with the app listening on loopback —
# nothing of it is published. That is the right shape for a server that already has a web server
# in front of it, which is most servers that are already hosting something. Put your existing
# nginx/Apache in front of 127.0.0.1:8010; deploy/nginx-claimai.conf is a site file that does it.
#
#   cp deploy/env.example .env.prod   # then fill it in — it will not start without the secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# On a server with nothing else on it, add the bundled Caddy instead and it will take ports 80
# and 443 and get the certificate itself:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile caddy up -d --build
#
# Either way, point an A record for CLAIMAI_DOMAIN at this host first: the certificate is issued
# against that name, and cannot be until it resolves.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: claimai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: claimai
    volumes:
      - claimai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimai -d claimai"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the app talks to it, over the compose network.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://claimai:${POSTGRES_PASSWORD}@db:5432/claimai
      APP_ENV: production
      # Anyone may come in; everyone leaves an address. See the README.
      ACCESS_GATE_ENABLED: ${ACCESS_GATE_ENABLED:-true}
      ACCESS_SESSION_SECRET: ${ACCESS_SESSION_SECRET:?set ACCESS_SESSION_SECRET in the env file}
      ACCESS_ADMIN_TOKEN: ${ACCESS_ADMIN_TOKEN:-}
      # With no SMTP host the code is written to the container log instead of being sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FRONTEND_ORIGIN: https://${CLAIMAI_DOMAIN}
      # Slows the visible stages down so an audience can follow them. 0 runs at full speed.
      DEMO_PACING_MS: ${DEMO_PACING_MS:-120}
    volumes:
      # The uploaded originals. They are rebuilt from nothing, so this outlives the container.
      - claimai-storage:/app/backend/storage
    # Loopback only. A web server on this host can reach it; the internet cannot, whatever the
    # firewall happens to allow. Caddy, when used, reaches it over the compose network instead.
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-8010}:8010"

  # Only with --profile caddy. Left out, nothing here touches ports 80 and 443, so a server
  # already serving another site keeps serving it.
  proxy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CLAIMAI_DOMAIN: ${CLAIMAI_DOMAIN:?set CLAIMAI_DOMAIN in the env file}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  claimai-pgdata:
  claimai-storage:
  caddy-data:
  caddy-config:
