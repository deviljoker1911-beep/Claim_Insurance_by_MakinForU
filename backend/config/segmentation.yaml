# Claim bundles: finding the documents inside one uploaded file.
#
# A claim packet usually arrives as a single PDF holding the pre-authorisation form, the case
# papers, the bills, the reports and the discharge summary one after another. Reading that file as
# one document makes the whole claim look like whatever its first page happens to be, and every
# document actually inside it is then reported as missing.
#
# Nothing here classifies anything. Each page is classified by the same engine that classifies a
# document, from the same document_types.yaml; this file only says when a page ends the document
# before it and starts another one.
version: 1

# A page only ends the document before it when it is a document naming itself: its own heading
# matches a type's title, and it is not torn between two types. That bar is the classifier's own —
# `title_confidence_base` in document_types.yaml — so it is not repeated here and the two cannot
# drift apart. A page that merely carries another type's vocabulary is the second page of
# something, and continues the document it is inside.

# Some documents carry no heading of their own past the first page and no heading at all on later
# ones. These are the things that identify one document, and a change in any of them between two
# pages that are otherwise continuous means the second page belongs to a different document: a
# second bill with its own number, rather than one bill of twice the length.
#
# The value captured by the first group is what is compared. Written generically: no hospital,
# insurer or TPA is named anywhere in this file.
document_identifiers:
  - label: bill number
    pattern: '(?:bill|invoice|receipt)\s*(?:no|number|num|#)\s*[:.\-]?\s*([A-Za-z0-9][A-Za-z0-9/\-]{2,31})'
  - label: report number
    pattern: '(?:report|lab|sample|specimen|accession|barcode)\s*(?:no|id|number|num|#)\s*[:.\-]?\s*([A-Za-z0-9][A-Za-z0-9/\-]{2,31})'
  - label: claim number
    pattern: '(?:claim|authorisation|authorization|pre-?auth)\s*(?:no|id|number|num|#)\s*[:.\-]?\s*([A-Za-z0-9][A-Za-z0-9/\-]{2,31})'

# "Page 1 of 4" counts a document's own pages. When that count starts again, the document before
# it has ended, whatever the two pages are classified as.
page_numbering:
  pattern: 'page\s*(\d{1,3})\s*(?:of|/)\s*(\d{1,3})'

# How many pages a file may hold before it is read as a possible bundle at all. A single-page file
# is one document by definition, and this keeps the ordinary upload of one document on exactly the
# path it has always taken.
min_pages_to_segment: 2
