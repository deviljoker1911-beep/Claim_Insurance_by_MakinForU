# Procedure-specific document checklists.
#
# The checklist says which documents a claim for a given procedure is expected to carry. It
# reports; it never raises findings — the rules in rules.yaml do that — and it never changes a
# document. Requirements are matched against the document types recognised from content, never
# against file names, and a document excluded as a duplicate satisfies nothing.
#
#   status           meaning
#   found            at least one document of an accepted type is in the claim
#   missing          no document of an accepted type is in the claim
#   review_required  such a document is there, and an open finding says a person should look
#   not_applicable   the requirement's condition does not hold for this claim
#
# Fields of a requirement:
#   key          stable identifier, used by the API and the UI
#   label        what a reviewer is shown
#   description  one line saying what the document is
#   doc_types    the document types that satisfy it (from document_types.yaml)
#   severity     how much a missing one matters: critical, review, warning or info
#   required     false marks a supporting document; it is still reported when absent
#   applies_when a condition key from `conditions` below (default: always)
#   question     what the operator is asked when the requirement is not met (phase 7)
#   why          why the document is being asked for, stated from the claim's own records
#   resolution   what a reviewer can do about it
version: 1

settings:
  # A document carrying an open finding of one of these severities puts its requirement into
  # review_required rather than found.
  review_required_severities: [critical, review, warning]
  # While any document is still in one of these processing states the checklist is provisional.
  provisional_document_states: [pending, queued, processing]

# Conditions a requirement may depend on. Every key here is implemented in
# app/checklist/engine.py; a requirement naming anything else is a configuration error.
conditions:
  always: This requirement always applies.
  implant_billed: An implant invoice is part of the claim.
  general_anaesthesia: The documents record anaesthesia other than local or topical.

# The catalogue. A procedure lists the requirements it needs and may override severity,
# required or applies_when for its own case.
requirements:
  - key: admission_record
    label: Admission record
    description: The record of the patient being admitted, with the reason for admission.
    # The same types rule R001 accepts, so the checklist and the finding cannot disagree
    # about whether this claim has one.
    doc_types: [admission_record]
    severity: critical
    question: Do you have the admission record for this stay?
    why: No admission record was found for this stay.
    resolution: Upload the admission record.

  - key: pre_operative_assessment
    label: Pre-operative assessment
    description: The fitness assessment recorded before the operation.
    doc_types: [pre_operative_assessment]
    severity: review
    question: Do you have the pre-operative assessment for this admission?
    why: The records show an operation, and the assessment made before it is not among the documents.
    resolution: Upload the pre-operative assessment, or record why it was not carried out.

  - key: surgeon_consultation
    label: Surgeon consultation
    description: The consultation note that establishes the indication for surgery.
    doc_types: [consultation]
    severity: review
    question: Do you have the surgeon's consultation note for this admission?
    why: The consultation that established the indication for surgery is not among the documents.
    resolution: Upload the consultation note that supports the decision to operate.

  - key: consent
    label: Informed consent
    description: The consent signed by the patient or the attendant before the operation.
    doc_types: [consent]
    severity: critical
    question: Do you have the signed consent form for this admission?
    why: No consent form was found, and an operation is documented for this admission.
    resolution: Upload the signed consent form.

  - key: anaesthesia_assessment
    label: Anaesthesia assessment
    description: The pre-anaesthetic evaluation.
    doc_types: [anaesthesia_assessment]
    severity: review
    applies_when: general_anaesthesia
    question: Do you have the pre-anaesthetic assessment for this admission?
    why: The records show anaesthesia was given, and the assessment made before it is not among the documents.
    resolution: Upload the pre-anaesthetic assessment.

  - key: operative_note
    label: Operative note
    description: The surgeon's record of the operation performed.
    doc_types: [operative_note]
    severity: critical
    question: Do you have the operative note for this admission?
    why: The documents record an operation, and the surgeon's note of it is not among them.
    resolution: Upload the operative note, or record why it is not available.

  - key: anaesthesia_record
    label: Anaesthesia record
    description: The intra-operative anaesthesia chart.
    doc_types: [anaesthesia_record]
    severity: critical
    applies_when: general_anaesthesia
    question: Do you have the anaesthesia record for this admission?
    why: The documents record an operation under anaesthesia, and the anaesthesia chart is not among them.
    resolution: Upload the anaesthesia record, or record why it is not available.

  - key: post_operative_notes
    label: Post-operative notes
    description: The progress notes written after the operation.
    doc_types: [post_operative_note]
    severity: review
    # Supporting: the discharge summary carries the post-operative course, so a claim without
    # separate progress notes is reported as short of them rather than held incomplete.
    required: false
    question: Do you have the post-operative notes for this admission?
    why: The progress notes written after the operation are not among the documents.
    resolution: Upload the post-operative progress notes.

  - key: nursing_records
    label: Nursing records
    description: The ward nursing chart for the stay.
    doc_types: [nursing_record]
    severity: info
    required: false
    question: Do you have the nursing record for this admission?
    why: The ward nursing chart for the stay is not among the documents.
    resolution: Upload the nursing record if the insurer asks for it.

  - key: medication_records
    label: Medication records
    description: The prescription or medication chart for the admission.
    doc_types: [prescription]
    severity: info
    required: false
    question: Do you have the prescription or medication chart for this admission?
    why: The medication record for the stay is not among the documents.
    resolution: Upload the prescription or medication chart if the insurer asks for it.

  - key: investigation_reports
    label: Investigation reports
    description: The laboratory and imaging reports for the admission.
    doc_types: [lab_report, investigation_report]
    severity: review
    question: Do you have the investigation reports for this admission?
    why: No laboratory or imaging report was found for this admission.
    resolution: Upload the investigation reports referred to in the clinical notes.

  - key: discharge_summary
    label: Discharge summary
    description: The summary of the admission, the operation and the advice on discharge.
    doc_types: [discharge_summary]
    severity: critical
    question: Do you have the discharge summary for this admission?
    why: No discharge summary was found, and the admission has a discharge date.
    resolution: Upload the discharge summary.

  - key: bills
    label: Hospital bill
    description: The final in-patient bill for the admission.
    doc_types: [hospital_bill]
    severity: critical
    question: Do you have the final hospital bill for this admission?
    why: No hospital bill was found for this admission.
    resolution: Upload the final hospital bill.

  - key: implant_invoice
    label: Implant invoice
    description: The vendor invoice for an implant used during the operation.
    doc_types: [implant_invoice]
    severity: review
    applies_when: implant_billed
    question: Do you have the implant invoice for this operation?
    why: An implant is part of this claim, and the vendor invoice for it is not among the documents.
    resolution: Upload the implant invoice that matches the implant recorded in the operative note.

procedures:
  - key: laparoscopic_cholecystectomy
    label: Laparoscopic cholecystectomy
    note: >-
      An in-patient laparoscopic operation under general anaesthesia. An implant invoice is
      expected only when an implant was billed.
    requires:
      - pre_operative_assessment
      - surgeon_consultation
      - consent
      - anaesthesia_assessment
      - operative_note
      - anaesthesia_record
      - post_operative_notes
      - nursing_records
      - medication_records
      - investigation_reports
      - discharge_summary
      - bills
      - implant_invoice

  - key: knee_replacement
    label: Total knee replacement
    note: >-
      A joint replacement always uses an implant, so the invoice for it is expected with the
      claim rather than only when one was billed.
    requires:
      - pre_operative_assessment
      - surgeon_consultation
      - consent
      - anaesthesia_assessment
      - operative_note
      - anaesthesia_record
      - post_operative_notes
      - nursing_records
      - medication_records
      - investigation_reports
      - discharge_summary
      - bills
      - key: implant_invoice
        applies_when: always
        severity: critical

  - key: cataract_surgery
    label: Cataract surgery
    note: >-
      Usually a day-care procedure under local or topical anaesthesia, so the anaesthesia
      documents are expected only where the records show anaesthesia beyond that. An
      intraocular lens is implanted in every case.
    requires:
      - pre_operative_assessment
      - surgeon_consultation
      - consent
      - anaesthesia_assessment
      - anaesthesia_record
      - operative_note
      - investigation_reports
      - discharge_summary
      - bills
      - medication_records
      - key: implant_invoice
        label: Intraocular lens invoice
        description: The vendor invoice for the intraocular lens implanted during the operation.
        applies_when: always
        severity: critical
      - key: post_operative_notes
        required: false
        severity: info
      - key: nursing_records
        required: false
        severity: info

  # --- Added after reading real claim packets --------------------------------------------------
  #
  # A reasonable baseline of what a cashless in-patient claim for each operation carries — the
  # documents a TPA commonly asks for, not any one insurer's authoritative list. Insurers differ;
  # a requirement here that an insurer does not want can be marked not applicable by the operator.
  #
  # The implant rule is the one real difference between them. Where an operation always leaves
  # an implant behind — a joint, a stent, a plate — its invoice is expected with the claim.
  # Where it only sometimes does — a hernia mesh, a ureteric stent — it is expected once one is
  # billed. Anaesthesia documents are asked for only where the records show anaesthesia beyond
  # local or topical, which is what spares an angioplasty done under local.

  - key: cholecystectomy
    label: Cholecystectomy
    note: >-
      Gallbladder removal where the documents do not say whether it was laparoscopic or open.
      The documents expected are the same either way.
    requires: [pre_operative_assessment, surgeon_consultation, consent, anaesthesia_assessment,
               operative_note, anaesthesia_record, post_operative_notes, nursing_records,
               medication_records, investigation_reports, discharge_summary, bills, implant_invoice]

  - key: open_cholecystectomy
    label: Open cholecystectomy
    note: An open abdominal operation under general anaesthesia.
    requires: [pre_operative_assessment, surgeon_consultation, consent, anaesthesia_assessment,
               operative_note, anaesthesia_record, post_operative_notes, nursing_records,
               medication_records, investigation_reports, discharge_summary, bills, implant_invoice]

  - key: appendicectomy
    label: Appendicectomy
    note: >-
      Usually an emergency operation, so the pre-operative assessment is often brief and
      recorded in the case papers rather than as a separate document.
    requires: [pre_operative_assessment, surgeon_consultation, consent, anaesthesia_assessment,
               operative_note, anaesthesia_record, post_operative_notes, nursing_records,
               medication_records, investigation_reports, discharge_summary, bills, implant_invoice]

  - key: hernia_repair
    label: Hernia repair
    note: >-
      A mesh is used in most repairs and is billed as an implant; its invoice is expected
      once it appears in the bill.
    requires:
      - pre_operative_assessment
      - surgeon_consultation
      - consent
      - anaesthesia_assessment
      - operative_note
      - anaesthesia_record
      - post_operative_notes
      - nursing_records
      - medication_records
      - investigation_reports
      - discharge_summary
      - bills
      - key: implant_invoice
        label: Mesh invoice
        description: The vendor invoice for the hernia mesh used in the repair.

  - key: caesarean_section
    label: Caesarean section
    note: >-
      Usually done under spinal anaesthesia, which is anaesthesia beyond local, so the
      anaesthesia documents are expected.
    requires: [pre_operative_assessment, surgeon_consultation, consent, anaesthesia_assessment,
               operative_note, anaesthesia_record, post_operative_notes, nursing_records,
               medication_records, investigation_reports, discharge_summary, bills, implant_invoice]

  - key: hysterectomy
    label: Hysterectomy
    note: Abdominal, vaginal or laparoscopic; the documents expected are the same.
    requires: [pre_operative_assessment, surgeon_consultation, consent, anaesthesia_assessment,
               operative_note, anaesthesia_record, post_operative_notes, nursing_records,
               medication_records, investigation_reports, discharge_summary, bills, implant_invoice]

  - key: tonsillectomy
    label: Tonsillectomy
    note: Done under general anaesthesia, usually with a short stay.
    requires: [pre_operative_assessment, surgeon_consultation, consent, anaesthesia_assessment,
               operative_note, anaesthesia_record, post_operative_notes, nursing_records,
               medication_records, investigation_reports, discharge_summary, bills, implant_invoice]

  - key: angioplasty
    label: Coronary angioplasty
    note: >-
      Usually done under local anaesthesia in the catheter laboratory, so the anaesthesia
      documents are expected only where the records show more than that. A stent is placed in
      almost every case, so its invoice is expected with the claim.
    requires:
      - pre_operative_assessment
      - surgeon_consultation
      - consent
      - anaesthesia_assessment
      - anaesthesia_record
      - key: operative_note
        label: Angioplasty procedure note
        description: The cardiologist's record of the procedure, the vessels treated and the stents placed.
      - post_operative_notes
      - nursing_records
      - medication_records
      - investigation_reports
      - discharge_summary
      - bills
      - key: implant_invoice
        label: Stent invoice
        description: The vendor invoice for each stent placed, with its batch and serial number.
        applies_when: always
        severity: critical

  - key: ureteroscopy
    label: Ureteroscopy / RIRS
    note: >-
      A ureteric stent is often left in place and billed as an implant; its invoice is
      expected once it appears in the bill.
    requires:
      - pre_operative_assessment
      - surgeon_consultation
      - consent
      - anaesthesia_assessment
      - operative_note
      - anaesthesia_record
      - post_operative_notes
      - nursing_records
      - medication_records
      - investigation_reports
      - discharge_summary
      - bills
      - key: implant_invoice
        label: Stent invoice
        description: The vendor invoice for the ureteric stent, where one was placed.

  - key: hip_replacement
    label: Hip replacement
    note: >-
      Total or partial; either way a prosthesis is implanted, so its invoice is expected with
      the claim rather than only when one is billed.
    requires:
      - pre_operative_assessment
      - surgeon_consultation
      - consent
      - anaesthesia_assessment
      - operative_note
      - anaesthesia_record
      - post_operative_notes
      - nursing_records
      - medication_records
      - investigation_reports
      - discharge_summary
      - bills
      - key: implant_invoice
        label: Prosthesis invoice
        description: The vendor invoice for the hip prosthesis, with its batch and serial number.
        applies_when: always
        severity: critical

  - key: cabg
    label: Coronary artery bypass grafting
    note: >-
      Open-heart surgery under general anaesthesia with an intensive-care stay. The grafts are
      the patient's own vessels, so an implant invoice is expected only if one is billed.
    requires: [pre_operative_assessment, surgeon_consultation, consent, anaesthesia_assessment,
               operative_note, anaesthesia_record, post_operative_notes, nursing_records,
               medication_records, investigation_reports, discharge_summary, bills, implant_invoice]

  - key: turp
    label: Transurethral resection of prostate
    note: Usually under spinal anaesthesia, which is anaesthesia beyond local.
    requires: [pre_operative_assessment, surgeon_consultation, consent, anaesthesia_assessment,
               operative_note, anaesthesia_record, post_operative_notes, nursing_records,
               medication_records, investigation_reports, discharge_summary, bills, implant_invoice]

  - key: pcnl
    label: Percutaneous nephrolithotomy
    note: >-
      Under general or spinal anaesthesia. A ureteric stent or nephrostomy tube is often left
      in place; its invoice is expected once it appears in the bill.
    requires:
      - pre_operative_assessment
      - surgeon_consultation
      - consent
      - anaesthesia_assessment
      - operative_note
      - anaesthesia_record
      - post_operative_notes
      - nursing_records
      - medication_records
      - investigation_reports
      - discharge_summary
      - bills
      - key: implant_invoice
        label: Stent invoice
        description: The vendor invoice for the stent or tube left in place, where one was.

  - key: fracture_fixation
    label: Fracture fixation
    note: >-
      Internal fixation leaves an implant behind by definition — a plate, screws, a nail or
      wires — so its invoice is expected with the claim.
    requires:
      - pre_operative_assessment
      - surgeon_consultation
      - consent
      - anaesthesia_assessment
      - operative_note
      - anaesthesia_record
      - post_operative_notes
      - nursing_records
      - medication_records
      - investigation_reports
      - discharge_summary
      - bills
      - key: implant_invoice
        label: Implant invoice
        description: The vendor invoice for the plates, screws, nails or wires used in the fixation.
        applies_when: always
        severity: critical

  # --- Answered, not read --------------------------------------------------------------------
  #
  # When no document names an operation, the claim asks the operator whether one was performed.
  # These two are what that answer can select. No document can name them, which is what
  # `declared_only` says: they are chosen by a person, and a checklist built from one says so.

  - key: medical_management
    label: Medical treatment, no operation
    declared_only: true
    note: >-
      The operator has said no operation was performed during this admission, so nothing is
      asked of an operation: no operative note, no anaesthesia record, no implant.
    requires:
      - admission_record
      - key: surgeon_consultation
        label: Treating doctor's consultation
        description: The consultation that records why the patient was admitted.
        question: Do you have the treating doctor's consultation note for this admission?
        why: The consultation that records the reason for admission is not among the documents.
        resolution: Upload the consultation note of the treating doctor.
      - key: consent
        label: Consent for admission and treatment
        description: The consent signed by the patient or the attendant on admission.
        severity: review
        question: Do you have the signed consent for admission and treatment?
        why: No consent form was found for this admission.
        resolution: Upload the signed consent for admission and treatment.
      - nursing_records
      - medication_records
      - investigation_reports
      - discharge_summary
      - bills

  - key: surgical_other
    label: An operation not in the list
    declared_only: true
    note: >-
      The operator has said an operation was performed that is not one this checklist
      recognises, so the documents any operation needs are asked for.
    requires: [pre_operative_assessment, surgeon_consultation, consent, anaesthesia_assessment,
               operative_note, anaesthesia_record, post_operative_notes, nursing_records,
               medication_records, investigation_reports, discharge_summary, bills, implant_invoice]
