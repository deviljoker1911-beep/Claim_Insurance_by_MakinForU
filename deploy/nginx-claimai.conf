# ClaimAI behind an nginx that is already serving other sites on this host.
#
# Install:
#   sudo cp deploy/nginx-claimai.conf /etc/nginx/sites-available/claimai
#   sudo sed -i 's/CLAIMAI_DOMAIN/claimai.example.com/g' /etc/nginx/sites-available/claimai
#   sudo ln -sf /etc/nginx/sites-available/claimai /etc/nginx/sites-enabled/claimai
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get the certificate, which rewrites the listen lines in this file for you:
#   sudo certbot --nginx -d claimai.example.com
#
# Nothing here touches the other sites: it is one more server block, matched by name.

server {
    listen 80;
    listen [::]:80;
    server_name CLAIMAI_DOMAIN;

    # certbot replaces this with a redirect to https once the certificate exists.
    location / {
        proxy_pass http://127.0.0.1:8010;

        # Debian and Ubuntu ship this with Host, X-Real-IP, X-Forwarded-For and — the one that
        # matters here — X-Forwarded-Proto, which is how the app knows to mark its session
        # cookie Secure. Setting those again by hand only earns a proxy_headers_hash warning.
        # On a distribution without this file, set those four headers here instead.
        include proxy_params;

        # A claim packet is a big upload, and OCR on it is not fast. The application caps
        # uploads itself (MAX_UPLOAD_MB); this only stops nginx cutting the request short.
        client_max_body_size 30M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # A demo, not somewhere search engines should be sending people.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
